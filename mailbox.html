<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Station — Mailbox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#050505;color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;}
  main{max-width:560px;margin:0 auto;padding:8px 16px 100px;}
  .page-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .page-title h1{font-size:16px;font-weight:700;}
  .live-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:#10b981;}
  .live-dot{width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .search-bar{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .search-bar input{background:transparent;border:none;color:#e5e5e5;font-size:13px;flex:1;outline:none;}
  .search-bar svg{color:#555;width:16px;height:16px;}
  .filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
  .filter-chip{padding:5px 10px;background:#0f0f0f;border:1px solid #1a1a1a;border-radius:6px;font-size:11px;color:#888;cursor:pointer;white-space:nowrap;}
  .filter-chip.active{background:rgba(16,185,129,.12);border-color:#10b981;color:#10b981;}
  .msg-item{padding:12px;border-bottom:1px solid #1a1a1a;cursor:pointer;transition:background .15s;}
  .msg-item:hover{background:#0f0f0f;}
  .msg-unread{border-left:2px solid #10b981;}
  .msg-read{border-left:2px solid transparent;}
  .compose-btn{position:fixed;bottom:80px;right:16px;width:48px;height:48px;background:#10b981;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.3);cursor:pointer;z-index:40;}
  .compose-btn svg{width:20px;height:20px;}
  .modal-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.8);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.hidden{display:none!important;}
  .modal-content{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:12px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1a1a1a;}
  .modal-body{flex:1;overflow-y:auto;padding:16px;}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #1a1a1a;}
  .btn-sm{padding:6px 12px;border-radius:5px;font-size:12px;font-weight:600;border:none;cursor:pointer;}
  .btn-ghost{background:transparent;color:#888;}
  .btn-ghost:hover{color:#fff;}
  .btn-primary{background:#10b981;color:#fff;}
  .btn-danger{background:transparent;color:#ef4444;}
  .context-menu{position:absolute;z-index:90;background:#111;border:1px solid #222;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.6);padding:6px 0;min-width:160px;}
  .context-menu.hidden{display:none!important;}
  .context-item{padding:8px 14px;font-size:12px;color:#c1c1c1;cursor:pointer;}
  .context-item:hover{background:#1a1a1a;color:#fff;}
  #toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:13px;}
  #toast.hidden{display:none!important;}
</style>
</head>
<body class="text-white">

<div id="ts-global-header"></div>

<<main>
  <div class="page-title">
    <div style="width:36px;height:36px;border-radius:8px;background:rgba(16,185,129,.1);display:flex;align-items:center;justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>
    <div>
      <h1>Mailbox</h1>
      <div class="live-indicator"><span class="live-dot"></span><span>Live Sync</span></div>
    </div>
    <div style="margin-left:auto;display:flex;gap:6px;">
      <button id="btn-search-toggle" class="btn-sm btn-ghost" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button id="btn-select-mode" class="btn-sm btn-ghost" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      </button>
    </div>
  </div>

  <div id="search-bar" class="search-bar hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="msg-search" placeholder="Search messages...">
  </div>

  <div class="filter-chips" id="filter-tabs">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="unread">Unread <span id="unread-count" style="margin-left:4px;background:#10b981;color:#fff;padding:1px 5px;border-radius:8px;font-size:9px;">0</span></button>
    <button class="filter-chip" data-filter="read">Read</button>
    <button class="filter-chip" data-filter="sent">Sent</button>
    <button class="filter-chip" data-filter="system">System</button>
  </div>

  <div id="selection-toolbar" class="hidden" style="display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;border:1px solid #1a1a1a;border-radius:8px;padding:8px 12px;margin-bottom:10px;">
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
      <button id="btn-select-all" style="background:transparent;border:none;color:#06b6d4;cursor:pointer;font-size:12px;">Select All</button>
      <span id="selection-count" style="color:#666;">0 selected</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button id="btn-mark-read" class="btn-sm btn-ghost" title="Mark as read">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/></svg>
      </button>
      <button id="btn-delete-selected" class="btn-sm btn-danger" title="Delete selected">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
      <button id="btn-cancel-select" class="btn-sm btn-ghost" style="color:#888;">Cancel</button>
    </div>
  </div>

  <div id="message-list"></div>
  <div id="empty-state" class="hidden" style="text-align:center;padding:40px 20px;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="color:#333;margin-bottom:8px;"><path d="M22 8.608V16.75C22 18.483 20.643 19.899 18.934 19.99C18.814 19.996 18.693 20 18.571 20H5.429C5.307 20 5.186 19.996 5.066 19.99C3.357 19.899 2 18.483 2 16.75V8.608L11.528 13.832C11.671 13.912 11.828 13.958 12 13.958C12.172 13.958 12.329 13.912 12.472 13.832L22 8.608Z"/><path d="M22 7.25V7.243L12.472 2.168C12.329 2.088 12.172 2.042 12 2.042C11.828 2.042 11.671 2.088 11.528 2.168L2 7.243V7.25C2 7.388 2.014 7.523 2.041 7.654L11.528 12.832C11.671 12.912 11.828 12.958 12 12.958C12.172 12.958 12.329 12.912 12.472 12.832L21.959 7.654C21.986 7.523 22 7.388 22 7.25Z"/></svg>
    <p style="font-size:13px;color:#555;">No messages found</p>
  </div>

  <div style="margin-top:16px;text-align:center;">
    <button id="btn-load-more" style="width:100%;padding:10px;background:transparent;border:1px solid #222;border-radius:8px;color:#888;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      Load More Messages
    </button>
  </div>
</main>

<button id="btn-compose" class="compose-btn" aria-label="Compose message">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
</button>

<div id="msg-modal" class="hidden modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="btn-close-modal" class="btn-sm btn-ghost" style="padding:4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
        <span style="font-weight:700;font-size:14px;">Message Details</span>
      </div>
      <div style="display:flex;gap:6px;">
        <button id="btn-reply" class="btn-sm btn-ghost" title="Reply"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg></button>
        <button id="btn-delete-msg" class="btn-sm btn-danger" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
      </div>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="compose-modal" class="hidden modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <span style="font-weight:700;font-size:14px;">New Message</span>
      <button id="btn-close-compose" class="btn-sm btn-ghost" style="padding:4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:10px;">
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">To</label>
        <input type="text" id="compose-to" class="form-input" style="width:100%;padding:8px 10px;background:#0a0a0a;border:1px solid #222;border-radius:5px;color:#e5e5e5;outline:none;" placeholder="Recipient">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Subject</label>
        <input type="text" id="compose-subject" class="form-input" style="width:100%;padding:8px 10px;background:#0a0a0a;border:1px solid #222;border-radius:5px;color:#e5e5e5;outline:none;" placeholder="Subject">
      </div>
      <div>
        <label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Message</label>
        <textarea id="compose-body" rows="4" style="width:100%;padding:8px 10px;background:#0a0a0a;border:1px solid #222;border-radius:5px;color:#e5e5e5;outline:none;resize:none;" placeholder="Type your message..."></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="btn-attach" class="btn-sm btn-ghost" style="border:1px solid #222;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <button id="btn-send" class="btn-sm btn-primary">Send Message</button>
      </div>
    </div>
  </div>
</div>

<div id="context-menu" class="hidden context-menu"></div>
<div id="toast" class="hidden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span id="toast-message">Operation successful</span></div>

<div id="ts-global-footer"></div>
<script src="app.js"></script>
</body>
</html>
