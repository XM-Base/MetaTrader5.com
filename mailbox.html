<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailbox - Trade Station</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230a0a0a'/><path d='M20 6L6 13L20 20L34 13Z' stroke='%2310b981' stroke-width='2' fill='rgba(16,185,129,0.08)'/><circle cx='20' cy='6' r='1.5' fill='%2310b981'/></svg>">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-tertiary: #161616;
            --border-color: #1a1a1a;
            --border-light: #222;
            --text-primary: #e5e5e5;
            --text-secondary: #a1a1a1;
            --text-muted: #666;
            --accent-start: #10b981;
            --accent-end: #06b6d4;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 16px 100px;
        }
        .mailbox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-top: 8px;
        }
        .mailbox-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mailbox-title svg {
            width: 28px;
            height: 28px;
            color: var(--accent-start);
        }
        .mailbox-title h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-muted);
        }
        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .header-btns {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-muted);
        }
        .icon-btn:hover {
            background: var(--bg-secondary);
            color: #fff;
        }
        .icon-btn svg {
            width: 16px;
            height: 16px;
        }
        .search-bar {
            margin-bottom: 12px;
            position: relative;
        }
        .search-bar.hidden { display: none; }
        .search-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .search-input:focus {
            border-color: var(--accent-start);
        }
        .search-input::placeholder { color: #555; }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .search-icon svg {
            width: 16px;
            height: 16px;
        }
        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .filter-chip.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-start);
            color: var(--accent-start);
        }
        .filter-chip:hover:not(.active) {
            border-color: #333;
            color: #fff;
        }
        .message-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 6px;
        }
        .message-row:hover { background: var(--bg-tertiary); border-color: var(--border-light); }
        .message-row.unread { border-left: 3px solid var(--accent-start); }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 700;
            color: var(--accent-start);
            font-size: 14px;
        }
        .message-content { flex: 1; min-width: 0; }
        .message-sender { font-size: 12px; font-weight: 600; color: var(--text-primary); }
        .message-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .message-time { font-size: 10px; color: #555; flex-shrink: 0; }
        .message-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-start); flex-shrink: 0; }
        .compose-btn {
            position: fixed;
            bottom: 80px;
            right: 16px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-start), #059669);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.2s;
            z-index: 40;
        }
        .compose-btn:hover { transform: scale(1.05); }
        .compose-btn:active { transform: scale(0.95); }
        .compose-btn svg { width: 24px; height: 24px; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state svg { width: 64px; height: 64px; opacity: 0.15; margin-bottom: 16px; }
        .empty-state p { color: var(--text-muted); font-size: 14px; }
        .hidden { display: none !important; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-body { padding: 16px; }
        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-primary {
            background: var(--accent-start);
            color: #fff;
        }
        .btn-primary:hover { background: #059669; }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-ghost:hover { background: var(--bg-tertiary); }
        .toast {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-left: 3px solid var(--accent-start);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.35s;
        }
        .toast.toast-visible { transform: translateX(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- Global Header -->
    <div id="ts-global-header"></div>

    <main>
        <div class="mailbox-header">
            <div class="mailbox-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <div>
                    <h1>Mailbox</h1>
                    <div class="live-indicator">
                        <span class="live-dot"></span>
                        <span>Live Sync</span>
                    </div>
                </div>
            </div>
            <div class="header-btns">
                <button class="icon-btn" id="btn-search-toggle" title="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
                <button class="icon-btn" id="btn-refresh" title="Refresh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
            </div>
        </div>

        <div class="search-bar hidden" id="search-bar">
            <span class="search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" id="msg-search" class="search-input" placeholder="Search messages...">
        </div>

        <div class="filter-tabs">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="unread">Unread <span id="unread-count" style="margin-left:4px;background:var(--accent-start);color:#fff;padding:1px 6px;border-radius:10px;font-size:10px;">0</span></button>
            <button class="filter-chip" data-filter="read">Read</button>
            <button class="filter-chip" data-filter="sent">Sent</button>
            <button class="filter-chip" data-filter="system">System</button>
        </div>

        <div id="message-list"></div>

        <div id="empty-state" class="empty-state hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
            <p>No messages found</p>
        </div>
    </main>

    <!-- Compose Button -->
    <button class="compose-btn" id="btn-compose" title="Compose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>

    <!-- Message Detail Modal -->
    <div id="msg-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <button class="btn btn-ghost" id="btn-close-modal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <span style="font-weight:600;font-size:14px;">Message Details</span>
                <button class="btn btn-ghost" id="btn-delete-msg" style="color:var(--danger);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Compose Modal -->
    <div id="compose-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span style="font-weight:600;font-size:14px;">New Message</span>
                <button class="btn btn-ghost" id="btn-close-compose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom:12px;">
                    <label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;">To</label>
                    <input type="text" id="compose-to" class="search-input" placeholder="Recipient" style="width:100%;">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;">Subject</label>
                    <input type="text" id="compose-subject" class="search-input" placeholder="Subject" style="width:100%;">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:10px;color:var(--text-muted);display:block;margin-bottom:4px;">Message</label>
                    <textarea id="compose-body" rows="5" class="search-input" placeholder="Type your message..." style="width:100%;resize:none;"></textarea>
                </div>
                <button class="btn btn-primary" id="btn-send" style="width:100%;">Send Message</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Global Footer -->
    <div id="ts-global-footer"></div>

    <script src="app.js"></script>

</body>
 </html>
