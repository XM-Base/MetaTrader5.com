<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailbox - Trade Station</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --accent-start: #10b981;
            --accent-end: #06b6d4;
            --accent-blue: #58a6ff;
            --danger: #f85149;
            --warning: #d29922;
            --success: #238636;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 8px 16px 100px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-top: 4px;
        }
        .page-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(88,166,255,0.2), rgba(88,166,255,0.1));
            border: 1px solid rgba(88,166,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-icon svg {
            width: 20px;
            height: 20px;
            color: var(--accent-blue);
        }
        .page-header h1 {
            font-size: 17px;
            font-weight: 700;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--success);
        }
        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .icon-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }
        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .search-bar {
            margin-bottom: 12px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 12px;
            font-family: inherit;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .search-bar .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .search-bar .search-icon svg {
            width: 15px;
            height: 15px;
        }
        .search-bar .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }
        .search-bar .clear-btn:hover {
            color: var(--text-primary);
        }
        .search-bar .clear-btn svg {
            width: 14px;
            height: 14px;
        }

        .filter-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .filter-chip:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }
        .filter-chip.active {
            background: rgba(88,166,255,0.15);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .chat-card {
            background: linear-gradient(135deg, rgba(88,166,255,0.08), rgba(88,166,255,0.04));
            border: 1px solid rgba(88,166,255,0.2);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .chat-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-avatar svg {
            width: 20px;
            height: 20px;
            color: #fff;
        }
        .chat-info {
            flex: 1;
        }
        .chat-name {
            font-size: 13px;
            font-weight: 700;
        }
        .chat-status {
            font-size: 10px;
            color: var(--success);
        }
        .chat-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--accent-blue), #3b82f6);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }
        .chat-btn:hover {
            box-shadow: 0 4px 14px rgba(88,166,255,0.3);
        }
        .chat-btn svg {
            width: 15px;
            height: 15px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-actions {
            display: flex;
            gap: 4px;
        }
        .section-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }
        .section-actions button:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        .section-actions button svg {
            width: 13px;
            height: 13px;
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .message-item:hover {
            border-color: var(--text-muted);
            background: var(--bg-tertiary);
        }
        .message-item.unread {
            border-left: 3px solid var(--accent-blue);
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-blue);
        }
        .message-content {
            flex: 1;
            min-width: 0;
        }
        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .message-subject {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .message-meta {
            text-align: right;
            flex-shrink: 0;
        }
        .message-time {
            font-size: 10px;
            color: var(--text-muted);
        }
        .message-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-blue);
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        .empty-state svg {
            width: 60px;
            height: 60px;
            color: var(--border-color);
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .compose-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(16,185,129,0.4);
            z-index: 40;
            transition: all 0.2s ease;
        }
        .compose-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(16,185,129,0.6);
        }
        .compose-btn svg {
            width: 22px;
            height: 22px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 1;
            border-radius: 14px 14px 0 0;
        }
        .modal-header h3 {
            font-size: 14px;
            font-weight: 700;
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }
        .modal-close:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        .modal-close svg {
            width: 18px;
            height: 18px;
        }
        .modal-body {
            padding: 16px;
        }
        .modal-body .form-group {
            margin-bottom: 12px;
        }
        .modal-body .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .modal-body .form-group input,
        .modal-body .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            font-family: inherit;
            resize: vertical;
        }
        .modal-body .form-group input:focus,
        .modal-body .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-start);
        }
        .btn-send {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-send:hover {
            box-shadow: 0 4px 14px rgba(16,185,129,0.3);
        }

        .detail-header {
            margin-bottom: 12px;
        }
        .detail-sender {
            font-size: 14px;
            font-weight: 700;
        }
        .detail-subject {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .detail-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .detail-body {
            font-size: 12px;
            color: var(--text-primary);
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .btn-reply {
            flex: 1;
            padding: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
        }
        .btn-delete {
            padding: 8px 14px;
            background: rgba(248,81,73,0.1);
            border: 1px solid rgba(248,81,73,0.3);
            border-radius: 6px;
            color: var(--danger);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div id="ts-global-header"></div>
    <div id="ts-notification-banner" class="hidden"></div>

    <main>
        <div class="page-header">
            <div class="page-header-left">
                <div class="page-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
                <div>
                    <h1>Mailbox</h1>
                    <div class="live-indicator">
                        <span class="live-dot"></span>
                        <span>Live Sync</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleSearch()" title="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <button class="icon-btn" onclick="refreshMessages()" title="Refresh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
            </div>
        </div>

        <div class="search-bar" id="search-bar" style="display:none;">
            <span class="search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="msg-search" placeholder="Search messages..." oninput="filterMessages()">
            <button class="clear-btn" onclick="clearSearch()" style="display:none;" id="clear-search-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="filter-chips">
            <button class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">All</button>
            <button class="filter-chip" data-filter="unread" onclick="setFilter('unread', this)">Unread <span id="unread-count" style="background:var(--accent-blue);color:#fff;padding:1px 6px;border-radius:10px;font-size:9px;margin-left:4px;">0</span></button>
            <button class="filter-chip" data-filter="read" onclick="setFilter('read', this)">Read</button>
            <button class="filter-chip" data-filter="system" onclick="setFilter('system', this)">System</button>
        </div>

        <div class="chat-card">
            <div class="chat-card-header">
                <div class="chat-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div class="chat-info">
                    <div class="chat-name">Live Chat Support</div>
                    <div class="chat-status">● Online - Replies in under 5 minutes</div>
                </div>
            </div>
            <a href="https://www.smartsupp.com/widget/0aca269b6fb7319bc6e3d94fecac02732bdbdb3a" target="_blank" class="chat-btn" style="text-decoration:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Open Live Chat
            </a>
        </div>

        <div class="section-title">
            Messages
            <div class="section-actions">
                <button onclick="refreshMessages()" title="Refresh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
            </div>
        </div>

        <div class="message-list" id="message-list"></div>
        <div class="empty-state" id="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <p>No messages found</p>
        </div>
    </main>

    <button class="compose-btn" onclick="openCompose()" title="Compose message">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <div id="ts-global-footer"></div>

    <!-- Message Detail Modal -->
    <div class="modal-overlay" id="msg-modal" style="display:none;">
        <div class="modal-panel">
            <div class="modal-header">
                <h3>Message Details</h3>
                <button class="modal-close" onclick="closeDetail()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="detail-body"></div>
        </div>
    </div>

    <!-- Compose Modal -->
    <div class="modal-overlay" id="compose-modal" style="display:none;">
        <div class="modal-panel">
            <div class="modal-header">
                <h3>New Message</h3>
                <button class="modal-close" onclick="closeCompose()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>To</label>
                    <input type="text" id="compose-to" placeholder="Recipient name">
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="compose-subject" placeholder="Message subject">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="compose-body" rows="5" placeholder="Type your message..."></textarea>
                </div>
                <button class="btn-send" onclick="sendMessage()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    Send Message
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let currentFilter = 'all';
        let searchQuery = '';

        function getMessages() {
            return TS_Mailbox.getAll();
        }

        function renderMessages() {
            let messages = getMessages();
            
            // Apply filter
            if (currentFilter === 'unread') messages = messages.filter(m => !m.read);
            else if (currentFilter === 'read') messages = messages.filter(m => m.read);
            else if (currentFilter === 'system') messages = messages.filter(m => m.type === 'system');
            
            // Apply search
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                messages = messages.filter(m => 
                    (m.from || '').toLowerCase().includes(q) ||
                    (m.subject || '').toLowerCase().includes(q) ||
                    (m.body || '').toLowerCase().includes(q)
                );
            }
            
            const list = document.getElementById('message-list');
            const empty = document.getElementById('empty-state');
            const unreadCount = getMessages().filter(m => !m.read).length;
            document.getElementById('unread-count').textContent = unreadCount;
            
            if (messages.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                list.innerHTML = messages.map(m => `
                    <div class="message-item ${m.read ? '' : 'unread'}" onclick="openDetail('${m.id}')">
                        <div class="message-avatar">${(m.from || '?')[0].toUpperCase()}</div>
                        <div class="message-content">
                            <div class="message-sender">${m.from || 'Unknown'}</div>
                            <div class="message-subject">${m.subject || 'No subject'}</div>
                        </div>
                        <div class="message-meta">
                            <div class="message-time">${formatTime(m.timestamp)}</div>
                            ${!m.read ? '<div class="message-badge"></div>' : ''}
                        </div>
                    </div>
                `).join('');
            }
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            return d.toLocaleDateString();
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMessages();
        }

        function toggleSearch() {
            const bar = document.getElementById('search-bar');
            bar.style.display = bar.style.display === 'none' ? 'block' : 'none';
            if (bar.style.display === 'block') {
                document.getElementById('msg-search').focus();
            }
        }

        function filterMessages() {
            searchQuery = document.getElementById('msg-search').value;
            const clearBtn = document.getElementById('clear-search-btn');
            clearBtn.style.display = searchQuery ? 'block' : 'none';
            renderMessages();
        }

        function clearSearch() {
            document.getElementById('msg-search').value = '';
            searchQuery = '';
            document.getElementById('clear-search-btn').style.display = 'none';
            renderMessages();
        }

        function openDetail(id) {
            const msg = getMessages().find(m => m.id === id);
            if (!msg) return;
            
            TS_Mailbox.markRead(id);
            
            document.getElementById('detail-body').innerHTML = `
                <div class="detail-header">
                    <div class="detail-sender">${msg.from || 'Unknown'}</div>
                    <div class="detail-subject">${msg.subject || 'No subject'}</div>
                    <div class="detail-time">${new Date(msg.timestamp).toLocaleString()}</div>
                </div>
                <div class="detail-body">${msg.body || ''}</div>
                <div class="modal-actions">
                    <button class="btn-reply" onclick="closeDetail(); openCompose(); document.getElementById('compose-to').value='${msg.from || ''}'; document.getElementById('compose-subject').value='Re: ${msg.subject || ''}'">Reply</button>
                    <button class="btn-delete" onclick="deleteMessage('${msg.id}')">Delete</button>
                </div>
            `;
            
            document.getElementById('msg-modal').style.display = 'flex';
            renderMessages();
        }

        function closeDetail() {
            document.getElementById('msg-modal').style.display = 'none';
        }

        function openCompose() {
            document.getElementById('compose-to').value = '';
            document.getElementById('compose-subject').value = '';
            document.getElementById('compose-body').value = '';
            document.getElementById('compose-modal').style.display = 'flex';
        }

        function closeCompose() {
            document.getElementById('compose-modal').style.display = 'none';
        }

        function sendMessage() {
            const to = document.getElementById('compose-to').value.trim();
            const subject = document.getElementById('compose-subject').value.trim();
            const body = document.getElementById('compose-body').value.trim();
            
            if (!to || !subject || !body) {
                TS_UI.showToast('Please fill all fields', 'warning');
                return;
            }
            
            TS_Mailbox.add({
                from: to,
                subject: subject,
                body: body,
                type: 'sent'
            });
            
            closeCompose();
            renderMessages();
            TS_UI.showToast('Message sent', 'success');
        }

        function deleteMessage(id) {
            TS_Mailbox.delete(id);
            closeDetail();
            renderMessages();
            TS_UI.showToast('Message deleted', 'info');
        }

        function refreshMessages() {
            renderMessages();
            TS_UI.showToast('Mailbox refreshed', 'info');
        }

        // Close modals on backdrop click
        document.getElementById('msg-modal')?.addEventListener('click', function(e) {
            if (e.target === this) closeDetail();
        });
        document.getElementById('compose-modal')?.addEventListener('click', function(e) {
            if (e.target === this) closeCompose();
        });

        document.addEventListener('DOMContentLoaded', renderMessages);
        
        window.setFilter = setFilter;
        window.toggleSearch = toggleSearch;
        window.filterMessages = filterMessages;
        window.clearSearch = clearSearch;
        window.openDetail = openDetail;
        window.closeDetail = closeDetail;
        window.openCompose = openCompose;
        window.closeCompose = closeCompose;
        window.sendMessage = sendMessage;
        window.deleteMessage = deleteMessage;
        window.refreshMessages = refreshMessages;
    </script>
</body>
</html>
