<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Station — Notifications</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#050505;color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;}
  main{max-width:560px;margin:0 auto;padding:8px 16px 100px;}
  .section-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .notif-card{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:10px;padding:14px;margin-bottom:10px;}
  .notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .notif-title{font-size:13px;font-weight:600;}
  .notif-time{font-size:11px;color:#555;}
  .notif-body{font-size:12px;color:#888;line-height:1.5;}
  .market-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
  .market-card{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:8px;padding:10px;}
  .market-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px;}
  .market-value{font-size:14px;font-weight:700;color:#e5e5e5;margin-top:2px;}
  .news-list{display:flex;flex-direction:column;gap:8px;}
  .news-item{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:8px;padding:10px;display:flex;gap:10px;}
  .news-thumb{width:48px;height:48px;background:#1a1a1a;border-radius:6px;flex-shrink:0;overflow:hidden;}
  .news-thumb img{width:100%;height:100%;object-fit:cover;}
  .news-content{flex:1;}
  .news-title{font-size:12px;font-weight:600;color:#e5e5e5;margin-bottom:4px;}
  .news-source{font-size:11px;color:#555;}
</style>
</head>
<body>

<div id="ts-global-header"></div>

<<main>
  <div class="section-title">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    Notifications
  </div>

  <div id="market-overview" class="market-grid">
    <div class="market-card"><div class="market-label">BTC/USD</div><div class="market-value" id="btc-price">--</div></div>
    <div class="market-card"><div class="market-label">ETH/USD</div><div class="market-value" id="eth-price">--</div></div>
    <div class="market-card"><div class="market-label">EUR/USD</div><div class="market-value" id="eur-price">--</div></div>
    <div class="market-card"><div class="market-label">GBP/USD</div><div class="market-value" id="gbp-price">--</div></div>
  </div>

  <div class="section-title" style="font-size:14px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
    Market News
  </div>
  <div id="news-list" class="news-list"></div>

  <div class="section-title" style="font-size:14px;margin-top:16px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Price Alerts
  </div>
  <div id="alerts-list"></div>
</main>

<div id="ts-global-footer"></div>
<script src="app.js"></script>
<script>
  (async function() {
    const coins = await TS_Market.getCoins();
    const btc = coins.find(c => c.symbol === 'btc');
    const eth = coins.find(c => c.symbol === 'eth');
    if (btc) document.getElementById('btc-price').textContent = '$' + btc.current_price.toLocaleString();
    if (eth) document.getElementById('eth-price').textContent = '$' + eth.current_price.toLocaleString();

    const fx = await TS_Market.getExchangeRates();
    const rates = fx.conversion_rates || {};
    document.getElementById('eur-price').textContent = (rates.EUR || 0.92).toFixed(4);
    document.getElementById('gbp-price').textContent = (rates.GBP || 0.79).toFixed(4);

    const news = await TS_Market.getNews();
    const list = document.getElementById('news-list');
    list.innerHTML = news.slice(0, 6).map(n => `
      <div class="news-item">
        <div class="news-thumb">${n.image ? `<img src="${n.image}" alt="">` : ''}</div>
        <div class="news-content">
          <div class="news-title">${n.headline}</div>
          <div class="news-source">${n.source} • ${new Date(n.datetime * 1000).toLocaleDateString()}</div>
        </div>
      </div>
    `).join('');
  })();
</script>
</body>
</html>
