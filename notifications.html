<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Trade Station</title>
<script src="app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050505;color:#e5e5e5;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:100px;}
  .max-w-3xl{max-width:768px;margin:0 auto;padding:16px;}
  .page-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin-bottom:20px;}
  .notif-card{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;}
  .notif-card.unread{border-left:3px solid #10b981;}
  .notif-card.read{border-left:3px solid #333;}
  .notif-icon{flex-shrink:0;width:32px;height:32px;border-radius:8px;background:#0a0a0a;border:1px solid #1a1a1a;display:flex;align-items:center;justify-content:center;}
  .notif-icon svg{width:16px;height:16px;}
  .notif-body{flex:1;}
  .notif-msg{font-size:13px;color:#e5e5e5;line-height:1.4;}
  .notif-time{font-size:11px;color:#666;margin-top:4px;}
  .notif-empty{text-align:center;color:#555;padding:40px;font-size:13px;}
  .market-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
  @media(min-width:640px){.market-grid{grid-template-columns:repeat(4,1fr);}}
  .market-tile{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:10px;padding:12px;}
  .market-symbol{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .market-price{font-size:16px;font-weight:700;color:#e5e5e5;margin-top:4px;}
  .market-change{font-size:11px;margin-top:2px;font-weight:600;}
  .market-change.up{color:#10b981;}
  .market-change.down{color:#ef4444;}
  .news-card{background:#0f0f0f;border:1px solid #1a1a1a;border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .news-headline{font-size:13px;font-weight:600;color:#e5e5e5;line-height:1.4;}
  .news-source{font-size:11px;color:#666;margin-top:6px;display:flex;align-items:center;gap:6px;}
  .section-title{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:24px 0 10px;}
</style>
</head>
<body>

  <div id="ts-global-header"></div>

  <main class="max-w-3xl">
    <div class="page-title">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      Notifications & Market
    </div>

    <div class="section-title">Live Market Overview</div>
    <div class="market-grid" id="market-grid">Loading...</div>

    <div class="section-title">Latest News</div>
    <div id="news-list">Loading...</div>

    <div class="section-title">Your Alerts</div>
    <div id="notifications-list">Loading...</div>
  </main>

  <div id="ts-global-footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Load market
      try {
        const coins = await TS_Market.getCoins();
        const grid = document.getElementById('market-grid');
        const top = coins.slice(0, 8);
        grid.innerHTML = top.map(c => {
          const chg = c.price_change_percentage_24h || 0;
          return `
            <div class="market-tile">
              <div class="market-symbol">${c.symbol.toUpperCase()}</div>
              <div class="market-price">$${c.current_price?.toFixed(2)}</div>
              <div class="market-change ${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</div>
            </div>
          `;
        }).join('');
      } catch {
        document.getElementById('market-grid').innerHTML = '<div class="notif-empty">Market data unavailable</div>';
      }

      // Load news
      try {
        const news = await TS_Market.getNews();
        const list = document.getElementById('news-list');
        list.innerHTML = news.slice(0, 6).map(n => `
          <div class="news-card">
            <div class="news-headline">${n.headline}</div>
            <div class="news-source">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
              </svg>
              ${n.source} • ${new Date(n.datetime * 1000).toLocaleString()}
            </div>
          </div>
        `).join('');
      } catch {
        document.getElementById('news-list').innerHTML = '<div class="notif-empty">News feed unavailable</div>';
      }
    });
  </script>
</body>
</html>
