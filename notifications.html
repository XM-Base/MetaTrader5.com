<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Trade Station</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='10' fill='%230a0a0a'/><path d='M20 6L6 13L20 20L34 13Z' stroke='%2310b981' stroke-width='2' fill='rgba(16,185,129,0.08)'/><circle cx='20' cy='6' r='1.5' fill='%2310b981'/></svg>">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --bg-tertiary: #161616;
            --border-color: #1a1a1a;
            --border-light: #222;
            --text-primary: #e5e5e5;
            --text-secondary: #a1a1a1;
            --text-muted: #666;
            --accent-start: #10b981;
            --accent-end: #06b6d4;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .toast-container {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 9998;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 16px 100px;
        }
        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-top: 8px;
        }
        .page-title h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .page-title svg {
            width: 28px;
            height: 28px;
            color: var(--accent-start);
        }
        .notif-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .notif-card:hover {
            border-color: var(--border-light);
            background: var(--bg-tertiary);
        }
        .notif-card.unread {
            border-left: 3px solid var(--accent-start);
        }
        .notif-card.read {
            opacity: 0.6;
        }
        .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .notif-icon.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        .notif-icon.warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }
        .notif-icon.info {
            background: rgba(37, 99, 235, 0.15);
            color: #2563eb;
        }
        .notif-icon.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }
        .notif-icon svg {
            width: 20px;
            height: 20px;
        }
        .notif-content {
            flex: 1;
            min-width: 0;
        }
        .notif-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .notif-message {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .notif-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .notif-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .notif-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .notif-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }
        .notif-btn svg {
            width: 16px;
            height: 16px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            opacity: 0.15;
            margin-bottom: 16px;
        }
        .empty-state p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-ghost:hover {
            background: var(--bg-tertiary);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Global Header -->
    <div id="ts-global-header"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <main>
        <div class="page-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <h1>Notifications</h1>
        </div>

        <div class="header-actions">
            <span id="notif-count" style="font-size:12px;color:var(--text-muted);">0 notifications</span>
            <button class="btn-ghost" onclick="clearAllNotifications()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="vertical-align:middle;margin-right:4px;"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                Clear All
            </button>
        </div>

        <div id="notifications-list"></div>

        <div id="empty-state" class="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <p>No notifications yet</p>
        </div>
    </main>

    <!-- Global Footer -->
    <div id="ts-global-footer"></div>

    <script src="app.js"></script>
    <script>
        function loadNotifications() {
            const notifications = TS_Notifications.getAll();
            const list = document.getElementById('notifications-list');
            const empty = document.getElementById('empty-state');
            const count = document.getElementById('notif-count');

            const active = notifications.filter(n => !n.dismissed);
            count.textContent = active.length + ' notifications';

            if (active.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = active.map(n => `
                <div class="notif-card ${n.read ? 'read' : 'unread'}" onclick="markRead('${n.id}')">
                    <div class="notif-icon ${n.type || 'info'}">
                        ${getNotifIcon(n.type)}
                    </div>
                    <div class="notif-content">
                        <div class="notif-title">${n.title || 'Notification'}</div>
                        <div class="notif-message">${n.message || ''}</div>
                        <div class="notif-time">${new Date(n.createdAt).toLocaleString()}</div>
                    </div>
                    <div class="notif-actions">
                        <button class="notif-btn" onclick="event.stopPropagation(); dismissNotif('${n.id}')" title="Dismiss">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getNotifIcon(type) {
            const icons = {
                success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            };
            return icons[type] || icons.info;
        }

        function markRead(id) {
            TS_Notifications.markRead(id);
            loadNotifications();
        }

        function dismissNotif(id) {
            TS_Notifications.dismiss(id);
            loadNotifications();
        }

        function clearAllNotifications() {
            TS_Notifications.clearAll();
            loadNotifications();
            TS_UI.showToast('All notifications cleared', 'info');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (TS_Auth.requireAuth()) {
                loadNotifications();
            }
        });
    </script>

</body>
 </html>
